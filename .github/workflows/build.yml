name: Byg DR Lyd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tjek at config.json er gyldig
        run: python3 -c "import json; c=json.load(open('config/config.json')); assert c['channels'], 'ingen kanaler'; print(len(c['channels']), 'kanaler')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Byg test-udgave (til emulator)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dr-lyd-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Byg udgave til Google Play
        if: env.HAS_KEY == 'true'
        env:
          SIGNING_STORE_FILE: upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > upload.jks
          ./gradlew --no-daemon bundleRelease
          rm upload.jks

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: dr-lyd-til-google-play
          path: app/build/outputs/bundle/release/*.aab
